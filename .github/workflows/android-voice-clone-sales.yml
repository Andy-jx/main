name: Build Android Voice Clone Sales

on:
  push:
    branches:
      - tool/android-voice-clone-sales
    paths:
      - "tools/android-voice-clone-sales/**"
      - ".github/workflows/android-voice-clone-sales.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: tools/android-voice-clone-sales
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-clone-sales-debug-apk
          path: tools/android-voice-clone-sales/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
